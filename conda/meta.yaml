{% set name = "zna" %}
{% set version = "0.3.5" %}
{% set username = "mkiyer" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ username }}/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 5bc6b62cd3abf21f30ae4247723e5fabdb4fdc065af133a29d0369ac0b23db33

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.15
    - make  # [unix]
    - llvm-tools  # [osx]
  host:
    - python
    - pip
    - scikit-build-core >=0.10
    - nanobind >=2.0
  run:
    - python
    - zstandard
    - pyyaml
  # `zna merge` JIT-compiles its overlap scan with numba. Deliberately a constraint and
  # NOT a dependency, and NOT a separate `zna-merge` output: numba drags llvmlite and
  # hard Python-version pins, and zna is a format library that should install lightly.
  # `import zna.merge` works without it (the identical scan runs as pure Python, ~50x
  # slower), and `zna merge` refuses to run that way unless given --allow-slow. This
  # entry installs nothing; it states the floor so that an environment which DOES pull
  # numba in cannot solve to a version that is too old.
  run_constrained:
    - numba >=0.61

test:
  imports:
    - zna
    - zna.core
    - zna.cli
    # numba is not in this environment, so this also asserts that the pure-Python
    # fallback in zna/merge/overlap.py still imports cleanly.
    - zna.merge
  commands:
    - zna --help
    # Exercises the subcommand registration. It resolves through zna/merge/args.py,
    # which imports nothing but argparse, so --help works with numba absent.
    - zna merge --help
    - python -c "import zna; print('ZNA version:', zna.__version__)"
    # Assert, do not merely print: the whole point of this package is the
    # compiled extension, and a build that silently fell back to the pure-Python
    # backend would otherwise pass its own test.
    - python -c "from zna import is_accelerated; assert is_accelerated(), 'C++ backend did not load'"
    - python -c "import zna, io; h=zna.ZnaHeader(read_group='t', seq_len_bytes=2); b=io.BytesIO(); w=zna.ZnaWriter(b,h); w.write_record('ACGTACGT',False,True,False); w.close(); r=list(zna.ZnaReader(io.BytesIO(b.getvalue())).records()); assert r[0][0]=='ACGTACGT', r"

about:
  home: https://github.com/{{ username }}/{{ name }}
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: High-performance binary format for compressed nucleic acid sequences
  description: |
    ZNA (Compressed Z-Nucleic N-Acid A) is a specialized binary format for 
    storing DNA/RNA sequences with exceptional compression and I/O speed.
    
    Features:
    - 1.7 GB/s decode and 726 MB/s encode on 150 bp reads; 6.6 GB/s decode on
      long reads (single core)
    - ~4x compression from 2-bit packing, more with Zstd on duplicated data
    - C++ acceleration with a pure Python fallback
    - Columnar block layout; batch and block-sharded reading for data loaders
    - Supports single-end, paired-end, interleaved, and overlap-merged reads
    - Supports strand-specific protocols and per-record fragment geometry
  doc_url: https://github.com/{{ username }}/{{ name }}/blob/main/README.md
  dev_url: https://github.com/{{ username }}/{{ name }}

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - {{ username }}
