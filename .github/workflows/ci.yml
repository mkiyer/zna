name: CI

# Build and test on every push and pull request.
#
# This exists because the only workflow used to be `publish.yml`, which triggers on
# `v*` tags alone -- so nothing compiled this project on Windows or Linux until a
# release was already tagged. `zna merge` is a second C++ extension added in 0.4.0, and
# the first MSVC that ever saw it failed on a GCC/Clang builtin. The tag had to be
# deleted and re-cut.
#
# A compiler error is the cheapest possible failure. It should not cost a release.
on:
  push:
    branches: ['**']
    # Tags too. publish.yml runs on `v*` and does NOT depend on this workflow, so
    # without this a tag push builds and uploads wheels while the full test suite runs
    # nowhere. cibuildwheel's per-wheel smoke test is a real gate but a narrow one --
    # it imports the extensions, it does not run the 630-test suite.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes the running job irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do NOT cancel the other legs when one fails: the whole point is to see every
      # platform's errors in one run, and a Windows-only compile error would otherwise
      # hide whatever Linux and macOS have to say.
      fail-fast: false
      matrix:
        # Both ends of the supported range on every OS. The compilers differ per OS
        # (MSVC / GCC / AppleClang) and that is the axis that actually catches things;
        # the interpreters in between are covered by the wheel build at release.
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.10', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # Not editable and not isolated: this is the closest cheap approximation of
        # what a user gets from a wheel, and it compiles both extensions.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "nanobind>=2.0" pytest
          python -m pip install . --no-build-isolation -v

      - name: Both extensions must have built
        # A silently missing extension is the failure mode this project keeps hitting:
        # the codec falls back to pure Python and the merge kernel to the reference
        # scan, both correct and both ~50x slower, so every test still passes.
        run: |
          python -c "
          import zna
          from zna.merge.backend import available_merge_backends
          assert zna.is_accelerated(), 'codec extension did not load'
          assert 'accel' in available_merge_backends(), 'merge extension did not load'
          print('ok', zna.__version__, available_merge_backends())
          "

      - name: Test
        # From a scratch directory so the installed package is under test rather than
        # the source tree beside it.
        run: python -m pytest "${{ github.workspace }}/tests" -q
        working-directory: ${{ runner.temp }}
